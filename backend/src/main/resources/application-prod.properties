server.port=8080
spring.application.name=skillpassport-backend

# ===================================================================
# Production Profile
# Postgres via env vars by default; file-backed H2 as a zero-setup fallback.
# Example:
#   DB_URL=jdbc:postgresql://db:5432/skillpassport
#   DB_DRIVER=org.postgresql.Driver
#   DB_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/skillpassportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Never seed demo accounts/passwords in production
app.seed-enabled=false

# JWT Configuration — MUST be set via environment in production
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration — MUST point at your deployed frontend origin
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}