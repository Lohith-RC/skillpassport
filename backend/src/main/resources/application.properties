server.port=8080
spring.application.name=skillpassport-backend

# ===================================================================
# Active Database Configuration: H2 In-Memory Database (Zero-Setup)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:skillpassportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===================================================================
# PostgreSQL Configuration (Uncomment when PostgreSQL service is running)
# ===================================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/skillpassport
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
app.jwt.secret=9a4f2c8d7e1b5a3f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173

