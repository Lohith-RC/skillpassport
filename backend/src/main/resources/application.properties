server.port=8080
spring.application.name=skillpassport-backend

# ===================================================================
# Database Configuration
# Default: H2 in-memory (zero-setup). In production, set DB_URL to a
# PostgreSQL JDBC URL, e.g. jdbc:postgresql://db:5432/skillpassport
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:h2:mem:skillpassportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# H2 Console: Disabled by default. Set H2_CONSOLE_ENABLED=true for local dev.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.database-platform=${DB_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${DB_DDL_AUTO:update}
spring.jpa.show-sql=false

# Demo seed data (demo accounts/passwords). Disable outside dev/demo environments.
app.seed-enabled=${SEED_DATA:true}

# JWT Configuration
# SECURITY: In production, set JWT_SECRET as an environment variable.
# The default below is for local development ONLY.
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration — comma-separated origins, env-overridable
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
