server.port=8080
spring.application.name=skillpassport-backend

# ===================================================================
# Active Database Configuration: H2 In-Memory Database (Zero-Setup)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:skillpassportdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console: Disabled by default. Set H2_CONSOLE_ENABLED=true for local dev.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===================================================================
# PostgreSQL Configuration (Uncomment when PostgreSQL service is running)
# ===================================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/skillpassport
# spring.datasource.username=postgres
# spring.datasource.password=postgres
# spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
# SECURITY: In production, set JWT_SECRET as an environment variable.
# The default below is for local development ONLY.
app.jwt.secret=${JWT_SECRET:9a4f2c8d7e1b5a3f9e8d7c6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f}
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
